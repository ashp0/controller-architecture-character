<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/web/style.css">
  <script>
    // If the 3D scene cannot start, say so on screen instead of showing an empty stage.
    (function () {
      function show(msg) {
        var d = document.getElementById('fatal') || document.createElement('div');
        d.id = 'fatal';
        d.style.cssText = 'position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);max-width:560px;padding:16px 20px;' +
          'background:#1a0705;border:1px solid #c4130c;color:#f3ead8;font:15px/1.5 ui-monospace,Menlo,monospace;z-index:99';
        d.textContent = '3D view failed to load: ' + msg + '  (try a hard reload: Cmd+Shift+R; check that WebGL is enabled)';
        document.body.appendChild(d);
      }
      window.addEventListener('error', function (e) { show(e.message || 'script error'); });
      window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
      try { var c = document.createElement('canvas'); if (!(c.getContext('webgl2') || c.getContext('webgl'))) window.addEventListener('DOMContentLoaded', function () { show('WebGL is not available in this browser'); }); } catch (e) {}
    })();
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "/web/vendor/three/build/three.module.js",
      "three/examples/jsm/": "/web/vendor/three/examples/jsm/",
      "three/addons/": "/web/vendor/three/examples/jsm/",
      "urdf-loader": "/web/vendor/urdf-loader/URDFLoader.js"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="breach" aria-hidden="true"></div>

  <!-- Top-left: title, mode, connection -->
  <header id="masthead">
    <div class="title">The Architecture</div>
    <div class="mode-row">
      <span id="mode" class="mode" data-mode="DORMANT">Dormant</span>
      <span id="conn" class="conn" data-state="connecting"><i></i><span>connecting…</span></span>
    </div>
  </header>

  <!-- Right side panel -->
  <aside id="panel" class="hud-toggle">
    <section class="block">
      <h2>Sight</h2>
      <div id="cam" class="cam empty">
        <img id="cam-img" alt="">
        <span class="cam-empty">no signal</span>
      </div>
    </section>

    <section class="block">
      <h2>Attention</h2>
      <div class="attention">
        <svg id="eye" viewBox="0 0 120 64" aria-hidden="true">
          <path class="eye-tri" d="M60 3 L116 61 L4 61 Z"/>
          <clipPath id="eye-clip"><path id="eye-clip-path" d="M14 34 Q60 34 106 34 Q60 34 14 34 Z"/></clipPath>
          <path id="eye-outline" class="eye-outline" d="M14 34 Q60 34 106 34 Q60 34 14 34 Z"/>
          <g clip-path="url(#eye-clip)">
            <circle class="eye-iris" cx="60" cy="34" r="12"/>
            <circle class="eye-pupil" cx="60" cy="34" r="5"/>
          </g>
        </svg>
        <dl class="att-stats">
          <div><dt>faces</dt><dd id="att-faces">0</dd></div>
          <div><dt>gaze</dt><dd id="att-looking">away</dd></div>
          <div><dt>bond</dt><dd><span class="meter"><span id="att-score"></span></span></dd></div>
        </dl>
      </div>
    </section>

    <section class="block">
      <h2>Design</h2>
      <div id="goal" class="goal idle">no design in progress</div>
    </section>

    <section class="block">
      <h2>Ledger</h2>
      <ul id="memory" class="ledger"><li class="empty">nothing recorded</li></ul>
    </section>

    <section class="block">
      <h2>Chronicle</h2>
      <ol id="log" class="log"></ol>
    </section>

    <section class="block dev">
      <h2>Latency</h2>
      <div id="latency" class="latency">—</div>
    </section>

    <footer class="keys"><kbd>Space</kbd> speak · <kbd>H</kbd> hide · <kbd>F</kbd> fullscreen · <kbd>C</kbd> reset view</footer>
  </aside>

  <!-- Bottom: what was heard, what is said -->
  <div id="dialogue">
    <div id="heard" class="heard"><span class="who">you</span><span id="heard-text"></span></div>
    <div id="subtitle" class="subtitle"></div>
  </div>

  <!-- Push-to-talk cue -->
  <div id="ptt" aria-hidden="true"><span class="ring"></span><span class="label">speak</span></div>

  <!-- Typed fallback input -->
  <form id="say" class="hud-toggle" autocomplete="off">
    <input id="say-input" type="text" placeholder="Speak to it…" spellcheck="false" aria-label="Type to the Architecture">
  </form>

  <script type="module" src="/web/app.js"></script>
</body>
</html>
